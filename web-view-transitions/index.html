<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="UI Playground · Web —— View Transitions 共享元素转场、hover 预取、渐进式加载。与 Android 端共用 motion-tokens 动效规范。">
  <meta name="theme-color" content="#f5f6fa">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#14161c">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' https://picsum.photos data:; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <title>UI Playground · Web (View Transitions)</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <noscript>
    <div class="noscript-warning">需要启用 JavaScript 才能查看演示。</div>
  </noscript>

  <header class="app-header">
    <h1>UI Playground · Web</h1>
    <p class="hint">hover 卡片 = 预取 → 点击 = 秒开。对比 Android 端的 motion-tokens.md。</p>
  </header>

  <!-- 列表视图 -->
  <main id="list-view">
    <div id="cards" class="cards"><!-- JS 渲染 --></div>
  </main>

  <!-- 详情视图 -->
  <main id="detail-view" hidden>
    <div class="detail-topbar">
      <button id="back-btn" class="back-btn">← 返回</button>
      <span id="prefetch-badge" class="badge" hidden aria-live="polite">预取命中 · 秒开</span>
    </div>
    <img id="detail-hero" class="detail-hero" alt="" hidden>
    <div class="detail-body">
      <h2 id="detail-title" tabindex="-1"></h2>
      <p id="detail-sub" class="detail-sub"></p>
      <p id="detail-body" class="detail-body-text"></p>
    </div>
    <div id="detail-skeleton" class="skeleton-block" aria-live="polite"></div>
  </main>

  <script src="app.js"></script>
</body>
</html>
